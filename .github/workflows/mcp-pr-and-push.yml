
name: "MCP: Pull Request and Push"

on:
  workflow_dispatch:
  # Automatic triggers removed; invoke through FounderOS/Admin Gate.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  call-test-lint:
    uses: ./.github/workflows/mcp-test-lint.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
